# Netlify config for the SELF-CONTAINED static demo (no backend needed).
# Netlify: Import from Git -> base directory "frontend" (settings below are picked up automatically).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  

# Single-page-app fallback so deep links such as /app/cases work.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
