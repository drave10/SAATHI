# Used when Netlify builds from Git. (The public/_redirects file does the same for drag-and-drop deploys.)
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Proxy API calls to the Render backend so the browser sees a single origin. Edit the hostname if your Render URL differs.
[[redirects]]
  from = "/api/*"
  to = "https://saathi-api.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
